<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaScript Calculator - Ahmed Seyam</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="calculator-card">
    <header class="header">
      <div class="badge">Assignment 02 Project</div>
      <h1>JavaScript Calculator</h1>
      <p>Developer: <span>Ahmed Seyam</span> (@ahmedseyam01)</p>
    </header>

    <div class="display-container">
      <div class="history" id="history"></div>
      <div class="screen" id="screen">0</div>
    </div>

    <div class="keypad">
      <button class="btn action" id="clear">C</button>
      <button class="btn action" id="backspace">⌫</button>
      <button class="btn operator" data-op="%">%</button>
      <button class="btn operator" data-op="/">÷</button>

      <button class="btn number">7</button>
      <button class="btn number">8</button>
      <button class="btn number">9</button>
      <button class="btn operator" data-op="*">×</button>

      <button class="btn number">4</button>
      <button class="btn number">5</button>
      <button class="btn number">6</button>
      <button class="btn operator" data-op="-">−</button>

      <button class="btn number">1</button>
      <button class="btn number">2</button>
      <button class="btn number">3</button>
      <button class="btn operator" data-op="+">+</button>

      <button class="btn number zero">0</button>
      <button class="btn number">.</button>
      <button class="btn equals" id="equals">=</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
